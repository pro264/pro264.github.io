const TILE_SOURCES = [
  {
    name: '高德地图',
    url: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}',
    options: { subdomains: ['1', '2', '3', '4'], maxZoom: 19, attribution: '&copy; 高德地图' }
  },
  {

  }
];

let baseTiles;
let tileSourceIndex = 0;
let tileErrorCount = 0;
let tileNotice;
let tileTimeout;

function showTileNotice(message, isError = false) {
  if (!tileNotice) {
    tileNotice = document.createElement('div');
    tileNotice.className = 'map-offline';
    document.getElementById('map').appendChild(tileNotice);
  }
  tileNotice.classList.toggle('error', isError);
  tileNotice.textContent = message;
}

function clearTileNotice() {
  if (tileNotice) tileNotice.remove();
  tileNotice = null;
  if (tileTimeout) clearTimeout(tileTimeout);
  tileTimeout = null;
}

function setTileSource(index) {
  const source = TILE_SOURCES[index];
  tileErrorCount = 0;
  if (baseTiles) map.removeLayer(baseTiles);
  baseTiles = L.tileLayer(source.url, {
    ...source.options,
    crossOrigin: true,
    errorTileUrl: ''
  }).addTo(map);
  showTileNotice(`正在加载底图：${source.name}`);
  if (tileTimeout) clearTimeout(tileTimeout);
  tileTimeout = setTimeout(() => {
    showTileNotice('底图加载失败，但行程点位仍可查看', true);
  }, 8000);
  baseTiles.on('tileload', clearTileNotice);
  baseTiles.on('tileerror tileloaderror', () => {
    tileErrorCount += 1;
    if (tileErrorCount === 3 && tileSourceIndex + 1 < TILE_SOURCES.length) {
      tileSourceIndex += 1;
      showTileNotice(`${source.name} 加载失败，正在切换底图...`, true);
      setTileSource(tileSourceIndex);
      return;
    }
    if (tileErrorCount >= 3) {
      showTileNotice('底图加载失败，但行程点位仍可查看', true);
    }
  });
}

setTileSource(tileSourceIndex);

});

  else {

      zIndexOffset: 2000
    }).addTo(map);

function markerIcon(type, emoji, num, color, role = '') {
  const cls = role || type || 'spot';
  const n = num ? `<span class="num">${num}</span>` : '';
  const style = color ? ` style="background:${color}"` : '';
  return L.divIcon({
    className: '',
    html: `<div class="map-marker ${cls}"${style}>${emoji || ''}${n}</div>`,
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-18]
  });
}

function icon(color, emoji) {

if (HOTEL.lat) L.marker([HOTEL.lat, HOTEL.lng], { icon: markerIcon('hotel','🏨'), zIndexOffset: 1000 }).addTo(map).bindPopup(`<b>${HOTEL.name}</b>`);

let markers = [], polylines = [];
const emojis = { food:'🍽️', spot:'📍', hotel:'🏨', transport:'🚗', drink:'🍺' };
const roleLabels = { food:'餐饮', spot:'景点', hotel:'住宿', transport:'交通', drink:'饮品' };

function clearMap() { markers.forEach(m=>map.removeLayer(m)); polylines.forEach(p=>map.removeLayer(p)); markers=[]; polylines=[]; }

function routeBearing(a, b) {
  const pa = map.latLngToLayerPoint(L.latLng(a[0], a[1]));
  const pb = map.latLngToLayerPoint(L.latLng(b[0], b[1]));
  return Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;
}

function fitMapTo(points, options = {}) {
  if (!points || !points.length) return;
  const bounds = L.latLngBounds(points.map(p => L.latLng(p[0], p[1])));
  const span = Math.max(
    Math.abs(bounds.getNorth() - bounds.getSouth()),
    Math.abs(bounds.getEast() - bounds.getWest())
  );
  const desktop = window.matchMedia('(min-width: 1100px)').matches;
  const maxZoom = options.overview ? 6.5 : (span < 0.18 ? 12 : span < 0.7 ? 10 : span < 2.2 ? 8.5 : 6.5);
  map.invalidateSize();
  map.fitBounds(bounds, {
    padding: desktop ? [72, 72] : [36, 36],
    maxZoom
  });
  setTimeout(() => map.invalidateSize(), 120);
}

function addRouteDecorations(coords, color, label, options = {}) {
  if (!coords || coords.length < 2) return;
  const segments = [];
  for (let i = 0; i < coords.length - 1; i++) segments.push([coords[i], coords[i + 1], i]);
  const pick = options.overview
    ? segments.filter((_, i) => i % Math.ceil(segments.length / 4) === 0).slice(0, 4)
    : (segments.length <= 2 ? segments : [segments[Math.floor(segments.length / 2)]]);
  pick.forEach(([a, b, i]) => {
    const lat = (a[0] + b[0]) / 2;
    const lng = (a[1] + b[1]) / 2;
    const angle = routeBearing(a, b);
    const arrow = L.marker([lat, lng], {
      icon: L.divIcon({
        className: '',
        html: `<div class="map-arrow" style="background:${color};transform:rotate(${angle}deg)">➜</div>`,
        iconSize:[20,20],
        iconAnchor:[10,10]
      }),
      interactive: false,
      zIndexOffset: 1200
    }).addTo(map);
    markers.push(arrow);
  });
  if (label) {
    const mid = coords[Math.floor(coords.length / 2)];
    const lb = L.marker(mid, {
      icon: L.divIcon({ className:'', html:`<div class="route-label">${label}</div>`, iconSize:[160,24], iconAnchor:[80,12] }),
      interactive: false,
      zIndexOffset: 1100
    }).addTo(map);
    markers.push(lb);
  }
}

function showDay(idx) {
  clearMap();
  if (idx === 0) {
    const routePts = OVERVIEW_ROUTE.map(p => [p.lat, p.lng]);
    if(routePts.length > 1) {
      const glow = L.polyline(routePts, { color:'#14b8a6', weight:12, opacity:.16, lineCap:'round', smoothFactor:1.2 }).addTo(map);
      const mainLine = L.polyline(routePts, { color:'#0f766e', weight:4.5, opacity:.82, dashArray:'12,8', lineCap:'round', smoothFactor:1.2 }).addTo(map);
      polylines.push(glow, mainLine);
      addRouteDecorations(routePts, '#0f766e', '全程主线', { overview: true });
    }
    OVERVIEW_ROUTE.forEach((p, i) => {
      const role = i === 0 ? 'start' : (i === OVERVIEW_ROUTE.length - 1 ? 'end' : 'spot');
      const m = L.marker([p.lat,p.lng], { icon: markerIcon(role, i === 0 ? '起' : (i === OVERVIEW_ROUTE.length - 1 ? '终' : '•'), i+1, '#0f766e', role), zIndexOffset: 900 + i })
        .addTo(map).bindPopup(`<b>${i+1}. ${p.name}</b><br><span style="color:#86868b">全程主线节点</span>`);
      markers.push(m);
    });
    const pts = routePts.slice();
    Object.values(HOTEL_STAYS).forEach(h => { if(h.lat) pts.push([h.lat,h.lng]); });
    fitMapTo(pts, { overview: true });
    DAYS.slice(1).forEach(d => {
      d.locations.filter(l=>l.type==='hotel').forEach(l => {
        const m = L.circleMarker([l.lat,l.lng], { radius:5, fillColor:'#f97316', color:'#fff', weight:1.5, fillOpacity:.9 })
          .addTo(map).bindPopup(`<b>${l.name}</b><br><span style="color:#86868b">${d.label} · ${roleLabels[l.type] || '点位'}</span>`);
        markers.push(m);
      });
    });
    return;
  }
  const day = DAYS.find(d=>d.id===idx);
  if(!day) return;
  const coords = [];
  let pointIndex = 0;
  day.locations.forEach(l => {
    if(!l.lat) return;
    pointIndex += 1;
    const role = pointIndex === 1 ? 'start' : '';
    const m = L.marker([l.lat,l.lng], { icon: markerIcon(l.type, emojis[l.type]||'📌', pointIndex, role ? undefined : day.color, role || l.type), zIndexOffset: l.type==='hotel'?1300:1000+pointIndex }).addTo(map);
    const gmapQ = l.gmap||encodeURIComponent(l.name+' Tokyo');
    m.bindPopup(`<b>${pointIndex}. ${l.name}</b>${l.time!=='—'?'<br><span style="color:#86868b">'+l.time+' · '+(roleLabels[l.type]||'点位')+'</span>':''}<br>${l.desc}${l.budget?'<br><span style="color:#ff9500">'+l.budget+'</span>':''}<br><a href="#" onclick="event.preventDefault();openAS('${l.name.replace(/'/g,"\\'")}',${l.lat},${l.lng},'${gmapQ}')">📍 导航</a>${l.xhs?' · <a href="'+l.xhs+'" target="_blank">📕 小红书</a>':''}`);
    markers.push(m);
    if(l.time!=='—') coords.push([l.lat,l.lng]);
  });
  const routeCoords = DAY_PATHS[idx] || coords;
  if(routeCoords.length>1) {
    const glow = L.polyline(routeCoords, { color:day.color, weight:11, opacity:.14, lineCap:'round', smoothFactor:1.1 }).addTo(map);
    const pl = L.polyline(routeCoords, { color:day.color, weight:4.5, opacity:.72, dashArray:'10,6', lineCap:'round', smoothFactor:1.1 }).addTo(map);
    polylines.push(glow, pl);
    const routeLabel = (ROUTE_STATS[idx] && ROUTE_STATS[idx].km) ? `${day.label} · ${ROUTE_STATS[idx].km}` : day.label;
    addRouteDecorations(routeCoords, day.color, routeLabel);
  }
  const boundsPts = [...routeCoords, ...coords];
  fitMapTo(boundsPts);
}

// ══════════ RENDER ══════════
function payChips(pay) {
  if(!pay) return '';
  let h = '<div class="pays">';
  const m = { cash:'💴', card:'💳', suica:'Suica', paypay:'PayPay', alipay:'支付宝', wechat:'微信' };
  for(const [k,label] of Object.entries(m)) {
    if(pay[k]!==undefined) { const c = pay[k]===1?'ok':pay[k]===0.5?'idk':'no'; h += `<span class="pay ${c}">${label}</span>`; }
  }
  return h+'</div>';
}

// ── 运行环境检测：在第三方 App 的 WebView 里，自定义 scheme 基本会被拦截 ──
const IN_APP_WEBVIEW = (() => {
  const ua = (navigator.userAgent || '').toLowerCase();
  return /micromessenger|xhs|xhsdiscover|discover\/|tiktok|aweme|weibo|qq\/|qqbrowser|alipayclient|dingtalk|lark|feishu|ucbrowser|baiduboxapp|toutiao|newsarticle/.test(ua);
})();

function xhsKeyword(loc) {
  if(loc.xhsKeyword) return loc.xhsKeyword.trim();
  return (loc.name||'').replace(/⭐.*$/g,'').replace(/（.*?）/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
}
function xhsAppUrl(loc) { return `xhsdiscover://search/result?keyword=${encodeURIComponent(xhsKeyword(loc))}&target_search=notes&source=deeplink`; }
function xhsWebUrl(loc) { return `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(xhsKeyword(loc))}&source=web_explore_feed`; }

function dpKeyword(loc) {
  if(loc.dianpingKeyword) return loc.dianpingKeyword.trim();
  return (loc.name||'').replace(/⭐.*$/g,'').replace(/（.*?）/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
}
function dpAppUrl(loc) { return `dianping://searchshoplist?keyword=${encodeURIComponent(dpKeyword(loc))}`; }
function dpWebUrl(loc) { return `https://m.dianping.com/searchshop?keyword=${encodeURIComponent(dpKeyword(loc))}`; }

window._extLocs = {};
DAYS.forEach(d => d.locations.forEach(l => { window._extLocs[`${d.id}::${l.name}`] = l; }));
window._xhsLocs = window._extLocs;

function openExt(key, kind) {
  const loc = window._extLocs[key]; if(!loc) return false;
  if (IN_APP_WEBVIEW) {
    window.location.href = kind==='dp' ? dpWebUrl(loc) : xhsWebUrl(loc);
  } else {
    window.location.href = kind==='dp' ? dpAppUrl(loc) : xhsAppUrl(loc);
  }
  return false;
}
function openXhs(key) { return openExt(key, 'xhs'); }
function openDp(key)  { return openExt(key, 'dp'); }

function locCard(loc, dayIdx) {
  const dot = loc.type==='food'?'food':loc.type==='spot'?'spot':loc.type==='drink'?'drink':loc.type==='hotel'?'hotel':'transport';
  const bdg = loc.type==='food'?'<span class="badge food">餐</span>':loc.type==='spot'?'<span class="badge spot">景</span>':loc.type==='drink'?'<span class="badge drink">饮</span>':'';
  const uid = `d${dayIdx}-${loc.name.replace(/\W/g,'')}`;
  const locKey = `${dayIdx}::${loc.name}`;
  const gmapQ = loc.gmap||encodeURIComponent(loc.name+' Tokyo');
  let lnk = `<button class="btn nav" onclick="openAS('${loc.name.replace(/'/g,"\\'")}',${loc.lat},${loc.lng},'${gmapQ}')">📍 导航</button>`;
  if(loc.xhs||loc.xhsKeyword) {
    const xhsHref = IN_APP_WEBVIEW ? xhsWebUrl(loc) : xhsAppUrl(loc);
    const xhsLabel = IN_APP_WEBVIEW ? '📕 小红书' : '📕 小红书 App';
    lnk += `<a href="${xhsHref}" onclick="return openXhs('${locKey.replace(/'/g,"\\'")}')" class="btn xhs">${xhsLabel}</a>`;
  }
  const dpEnabled = loc.dianping !== false &&
    (loc.dianping || loc.dianpingKeyword || loc.type==='food' || loc.type==='drink');
  if(dpEnabled) {
    const dpHref = IN_APP_WEBVIEW ? dpWebUrl(loc) : dpAppUrl(loc);
    const dpLabel = IN_APP_WEBVIEW ? '🍜 大众点评' : '🍜 大众点评 App';
    lnk += `<a href="${dpHref}" onclick="return openDp('${locKey.replace(/'/g,"\\'")}')" class="btn dp">${dpLabel}</a>`;
  }
  if(loc.reserve) lnk += `<a href="${loc.reserve}" target="_blank" class="btn rsv">📅 预约</a>`;
  return `<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="card" onclick="if(!event.target.closest('.btn,.links'))toggle('${uid}')"><div class="time">${loc.time!=='—'?loc.time:'备选'}</div><div class="name">${bdg} ${loc.name}</div><div class="desc">${loc.desc}</div>${loc.budget?'<div class="budget">'+loc.budget+'</div>':''}${payChips(loc.pay)}<div class="links">${lnk}</div>${loc.detail?'<div class="details" id="'+uid+'">'+loc.detail.replace(/\n/g,'<br>')+'</div>':''}</div></div>`;
}

function renderDay(idx) {
  const d = DAYS.find(x=>x.id===idx); if(!d) return '';
  const main = d.locations.filter(l=>l.time!=='—');
  const alt = d.locations.filter(l=>l.time==='—');
  let h = `<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div>`;
  h += hotelAssessmentHtml(idx);
  h += routeStatsHtml(idx);
  h += foodPicksHtml(idx);
  if(main.length) { h += '<div class="section-head">行程</div><div class="timeline">'; main.forEach(l => h += locCard(l, idx)); h += '</div>'; }
  if(alt.length) { h += '<div class="section-head">备选</div><div class="timeline">'; alt.forEach(l => h += locCard(l, idx)); h += '</div>'; }
  return h;
}

function hotelAssessmentHtml(idx) {
  const h = HOTEL_STAYS[idx]; if(!h) return '';
  return `<div class="section-head">住宿定位与评估</div>
  <div class="hotel-card">
    <div class="hotel-name">${h.name}</div>
    <div class="hotel-address">${h.city} · ${h.address}</div>
    <div class="hotel-verdict">${h.verdict}</div>
    <div class="hotel-risk">${h.risk}<br>调研来源：${h.source}。定位坐标已按公开地址/片区写入地图，最终导航请用高德店名搜索确认。</div>
    <div class="links">
      <button class="btn nav" onclick="openAS('${h.name.replace(/'/g,"\\'")}',${h.lat},${h.lng},'${h.name.replace(/'/g,"\\'")}')">📍 导航</button>
      <a href="${xhsWebUrl({xhsKeyword:h.name+' 住宿 停车 早餐'})}" class="btn xhs" target="_blank">📕 小红书</a>
      <a href="${dpWebUrl({dianpingKeyword:h.name})}" class="btn dp" target="_blank">🍜 大众点评</a>
    </div>
  </div>`;
}

function routeStatsHtml(idx) {
  const s = ROUTE_STATS[idx]; if(!s) return '';
  return `<div class="section-head">路程与成本</div>
  <div class="route-card">
    <div class="route-title">${s.route}</div>
    <div class="route-grid">
      <div class="stat-pill"><div class="k">方式</div><div class="v">${s.mode}</div></div>
      <div class="stat-pill"><div class="k">距离</div><div class="v">${s.km}</div></div>
      <div class="stat-pill"><div class="k">时间</div><div class="v">${s.drive}</div></div>
      <div class="stat-pill"><div class="k">费用</div><div class="v">${s.cost}</div></div>
    </div>
    <div class="route-note">油耗：${s.fuel}；过路/停车：${s.toll}。${s.note}</div>
  </div>`;
}

function foodPicksHtml(idx) {
  const picks = FOOD_PICKS[idx] || [];
  if(!picks.length) return '';
  let h = '<div class="section-head">具体餐厅候选</div><div class="food-picks">';
  picks.forEach(p => {
    const locKey = `${idx}::${p.name}`;
    window._extLocs[locKey] = { name:p.name, dianpingKeyword:p.query, xhsKeyword:p.query, gmap:p.query, lat:0, lng:0 };
    h += `<div class="food-card">
      <div class="food-top">
        <div><div class="food-name">${p.name}</div><div class="food-area">${p.area}</div></div>
        <span class="food-tag pick">${p.pick}</span>
      </div>
      <div class="food-why">${p.why}</div>
      <div class="food-meta"><span class="food-tag">${p.budget}</span><span class="food-tag">${p.source}</span></div>
      <div class="links">
        <button class="btn nav" onclick="openAS('${p.name.replace(/'/g,"\\'")}',0,0,'${p.query.replace(/'/g,"\\'")}')">📍 导航</button>
        <a href="${xhsWebUrl({xhsKeyword:p.query})}" class="btn xhs" target="_blank">📕 小红书</a>
        <a href="${dpWebUrl({dianpingKeyword:p.query})}" class="btn dp" target="_blank">🍜 大众点评</a>
      </div>
    </div>`;
  });
  return h + '</div>';
}

// ══════════ NAV ══════════
let cur = 0;
const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');
let resizeTimer;

DAYS.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (d.id===0?' active':'');
  btn.dataset.day = d.id;
  btn.textContent = d.label;
  tabsEl.appendChild(btn);
});

function go(idx) {
  cur = idx;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', +t.dataset.day===idx));
  contentEl.innerHTML = idx===0 ? overviewContent() : renderDay(idx);
  showDay(idx);
  contentEl.scrollTo({top:0});
  window.scrollTo({top:0, behavior:'smooth'});
  const tab = tabsEl.querySelector(`[data-day="${idx}"]`);
  if(tab) tab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

function toggle(id) { const el=document.getElementById(id); if(el) el.classList.toggle('closed'); }

tabsEl.addEventListener('click', e => { const t=e.target.closest('.tab'); if(t) go(+t.dataset.day); });
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    map.invalidateSize();
    showDay(cur);
  }, 160);
});

go(0);

/* ── Action Sheet for Navigation ── */
const asOverlay = document.createElement('div');
asOverlay.className = 'as-overlay';
asOverlay.innerHTML = `<div class="as-sheet">
  <div class="as-group"><div class="as-title" id="as-title">选择导航方式</div></div>
  <div class="as-group" id="as-opts"></div>
  <div class="as-group"><button class="as-item as-cancel" onclick="closeAS()">取消</button></div>
</div>`;
document.body.appendChild(asOverlay);
asOverlay.addEventListener('click', e => { if (e.target === asOverlay) closeAS(); });

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
function amapAppUrl(name, lat, lng) {
  const scheme = IS_IOS ? 'iosamap' : 'androidamap';
  return `${scheme}://viewMap?sourceApplication=trip&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lng}&dev=0`;
}
function amapWebUrl(name, lat, lng) {
  return `https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name)}&src=trip&coordinate=wgs84&callnative=1`;
}
function amapRouteUrl(name, lat, lng) {
  return `https://uri.amap.com/navigation?to=${lng},${lat},${encodeURIComponent(name)}&mode=car&policy=1&coordinate=wgs84&callnative=1`;
}
function baiduRouteUrl(name, lat, lng) {
  return `https://api.map.baidu.com/direction?destination=latlng:${lat},${lng}|name:${encodeURIComponent(name)}&mode=driving&coord_type=wgs84&output=html&src=trip-map-builder`;
}
function openAmap(name, lat, lng) {
  if (IN_APP_WEBVIEW) { window.open(amapWebUrl(name, lat, lng)); return; }
  window.location.href = amapAppUrl(name, lat, lng);
}
function openAmapRoute(name, lat, lng) {
  window.open(amapRouteUrl(name, lat, lng));
}

function openAS(name, lat, lng, gmap) {
  const q = gmap || encodeURIComponent(name + ' Tokyo');
  const encName = encodeURIComponent(name);
  const safeName = name.replace(/'/g,"\\'");
  document.getElementById('as-title').textContent = name;
  if (!lat || !lng) {
    const amapSearch = `https://www.amap.com/search?query=${encodeURIComponent(q)}`;
    const googleSearch = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    document.getElementById('as-opts').innerHTML =
      `<button class="as-item" onclick="window.open('${amapSearch}');closeAS()">🧭 高德搜索</button>` +
      `<button class="as-item" onclick="window.open('${googleSearch}');closeAS()">🗺️ Google 搜索</button>`;
    asOverlay.classList.add('show');
    return;
  }
  // WebView 内 maps:// 通常被拦截，改用 https Apple Maps URL —— iOS 系统会自动拉起 Apple Maps
  const appleUrl = IN_APP_WEBVIEW
    ? `https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${encName}`
    : `maps://maps.apple.com/?q=${lat},${lng}&name=${encName}`;
  const googleUrl = `https://www.google.com/maps/search/?api=1&query=${q}`;
  const googleRouteUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  const baiduUrl = baiduRouteUrl(name, lat, lng);
  document.getElementById('as-opts').innerHTML =
    `<button class="as-item" onclick="openAmapRoute('${safeName}',${lat},${lng});closeAS()">🚗 高德驾车导航</button>` +
    `<button class="as-item" onclick="openAmap('${safeName}',${lat},${lng});closeAS()">📍 高德查看地点</button>` +
    `<button class="as-item" onclick="window.open('${baiduUrl}');closeAS()">🧭 百度驾车路线</button>` +
    `<button class="as-item" onclick="window.open('${googleRouteUrl}');closeAS()">🗺️ Google 驾车路线</button>` +
    `<button class="as-item" onclick="window.open('${appleUrl}');closeAS()">🍎 Apple Maps</button>`;
  asOverlay.classList.add('show');
}
function closeAS() { asOverlay.classList.remove('show'); }
</script>
